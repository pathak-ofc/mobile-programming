<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .contact-card {
            width: min(92vw, 460px);
            background: #ffffff;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 1.6rem;
            text-align: center;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: inline-block;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 4px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.08s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: translateY(1px);
        }

        #details {
            margin-top: 24px;
        }

        #details p {
            margin: 0 0 10px;
            padding: 12px;
            border-left: 3px solid #2563eb;
            border-radius: 6px;
            background: #f8fafc;
            overflow-wrap: anywhere;
        }

        #details p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <section class="contact-card">
        <h1>Contact Us</h1>
        <form onsubmit="event.preventDefault(); writeUserData(name.value, email.value, message.value);">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        <div id="details"></div>
    </section>
    <script type="module" src="form.js"></script>
</body>
</html>
