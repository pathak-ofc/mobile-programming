<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div id="main">
        <div id="card">
            <img class="pic" src="image.jpg" alt="profilepic">
            <div id="info">
                <p class="name">Bimal Pathak</p>
                <p class="location">Gongabu, Kathmandu</p>
                <div id="qrr">
                    <button id="qr">Show QR</button>
                    <div id="show">
                        <img class="qri" src="qr.png" alt="QR code">
                        <button id="hide">Hide QR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
